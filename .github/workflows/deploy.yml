name: Preview on GitHub Pages (manual, via legacy entry point)

# GitHub only dispatches workflows registered on the default branch, and only deploy.yml is.
# On v2 this file just runs the noindex preview: gh workflow run deploy.yml --ref v2
# Manual runs only; no push trigger. Revert this commit after the preview (docs/v2/PREVIEW.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preview:
    uses: ./.github/workflows/preview-pages.yml
