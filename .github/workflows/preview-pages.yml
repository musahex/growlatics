name: Preview on GitHub Pages (manual)

# Noindex preview of branch v2 at https://musahex.github.io/growlatics/.
# Production is https://growlatics.us (Hostinger); this workflow never touches it.
# Manual runs only: gh workflow run preview-pages.yml --ref v2. See docs/v2/PREVIEW.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # basePath /growlatics, noindex meta; postbuild writes Disallow robots.txt and the prefixed manifest.
      - name: Build preview
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: preview

      # GitHub Pages serves out/404.html for unknown URLs; .nojekyll keeps _next/.
      - name: Prepare Pages output
        run: |
          test -f out/404.html
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
