name: Preview on GitHub Pages (manual)

# Noindex preview of branch v2 at https://musahex.github.io/growlatics/.
# Production is https://growlatics.us (Hostinger); this workflow never touches it.
# Manual runs only: gh workflow run preview-pages.yml --ref v2. See docs/v2/PREVIEW.md.
# Isolation (enforced by scripts/deploy/check-workflows.mjs): never a push trigger, no Hostinger secrets, and only
# the noindex preview build may reach Pages. Production is .github/workflows/deploy-production.yml.
on:
  workflow_dispatch:
  # Called by deploy.yml: GitHub only dispatches workflows that exist on the default branch (main).
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v2
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # basePath /growlatics, noindex meta; scripts/postbuild.mjs writes an Allow robots.txt (so crawlers can read the noindex), the prefixed manifest, and drops lab + legal drafts.
      - name: Build preview
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: preview

      # GitHub Pages serves out/404.html for unknown URLs; .nojekyll keeps _next/.
      - name: Prepare Pages output
        run: |
          test -f out/404.html
          grep -q 'noindex' out/index.html || { echo "::error::not a preview build; refusing to publish an indexable site to Pages"; exit 1; }
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
